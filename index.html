<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evie and Sam's Website</title>
    <!-- Link external CSS styles here -->
    <link rel="stylesheet" href="style.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
        }
        .gallery-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
        }
        .image-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .gallery-img {
            max-width: 100%;
            max-height: 500px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .nav-btn {
            background: #15988b;
            color: rgb(0, 0, 0);
            border:2px solid #000000; 
            padding-right: 18%;
            padding-left: 18%;
            margin-right:0;
            margin-left:0;
            font-size: 35px;
            font-weight: 900;
            cursor: pointer;
            border-radius: 4px;
            user-select: none;
        }
        .nav-btn:hover {
            background:  #0d5d55;
        }
        .nav-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .counter {
            margin-top: 10px;
            font-size: 40px;
            margin-bottom:20px;
            font-weight:bolder;
            color: #000000;
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
        }
        .next-prev-buttons {
            display:block;
            width:100%;
        }
        .title-area {
            width:100%;
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
            font-weight:bolder;
            border-bottom: 3px solid black;
        }
    </style>
</head>
<body>

    <header >
        <div class = "title-area">
        <center>
        <h1>Evie and Sam's Website</h1>
        </center>
    </div>
    </header>

    <main>
        <div class="gallery-container">
            <div id="imageCounter" class="counter"></div>
            <div class="image-wrapper">
                <img width="100%" id="galleryDisplay" class="gallery-img" src="" alt="Gallery Image">
                <div class="next-prev-buttons">
                    <center>
                    <button id="prevBtn" class="nav-btn" onclick="changeImage(-1)">&larr;</button>
                    <button id="nextBtn" class="nav-btn" onclick="changeImage(1)">&rarr;</button>
                </center>
                </div>
            </div>
            
        </div>
        
        <script>
            // 1. SET YOUR TOTAL NUMBER OF IMAGES (N) HERE
            const TOTAL_IMAGES = 9; 
        
            // Start at the most recent image (N)
            let currentIndex = TOTAL_IMAGES; 
        
            const imgElement = document.getElementById('galleryDisplay');
            const counterElement = document.getElementById('imageCounter');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
        
            function updateGallery() {
                // Update image source path
                imgElement.src = `images/${currentIndex}.png`;
                
                // Update text counter
                counterElement.innerText = `Number ${currentIndex}`;
        
                // Disable buttons at boundaries
                prevBtn.disabled = (currentIndex === 1);
                nextBtn.disabled = (currentIndex === TOTAL_IMAGES);
            }
        
            function changeImage(direction) {
                let nextIndex = currentIndex + direction;
                
                // Ensure index stays within 1 to N bounds
                if (nextIndex >= 1 && nextIndex <= TOTAL_IMAGES) {
                    currentIndex = nextIndex;
                    updateGallery();
                }
            }
        
            // Initialize gallery on page load
            window.onload = updateGallery;
        </script>
    </main>
    
 

    <!-- Link external JavaScript here -->
    <script src="script.js"></script>
</body>
</html>
